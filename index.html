<!DOCTYPE html>
<html>
  <head>
    <title>Pawssport</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>🐾 Pawssport</h1>
    <p>Your pet's health passport, by Pink Paws</p>

    <nav>
      <button id="nav-pets" class="active" onclick="showPage('pets')">My Pets</button>
      <button id="nav-grooming" onclick="showPage('grooming')">Grooming</button>
      <button id="nav-sitter" onclick="showPage('sitter')">Pet Sitter</button>
      <button id="nav-bookings" onclick="showPage('bookings')">Bookings</button>
    </nav>

    <div id="page-pets" class="page">
      <div class="pet-row">
        <div class="pet-card" onclick="showPet(0)">
          <div class="pet-emoji">🐶</div>
          <h2>Milo</h2>
          <p>Dog</p>
        </div>

        <div class="pet-card" onclick="showPet(1)">
          <div class="pet-emoji">🐱</div>
          <h2>Luna</h2>
          <p>Cat</p>
        </div>
      </div>

      <div id="details"></div>
    </div>

    <div id="page-grooming" class="page hidden">
      <div class="form-box">
        <h2>✂️ Book at Pink Paws</h2>

        <label>Which pet?</label>
        <select id="groom-pet"></select>

        <label>Service</label>
        <select id="groom-service">
          <option>Bath &amp; Blow-dry - ₹800</option>
          <option>Full Grooming - ₹1,500</option>
          <option>Nail Trim &amp; Ear Clean - ₹400</option>
          <option>Spa Package - ₹2,200</option>
        </select>

        <label>Date</label>
        <input type="date" id="groom-date">

        <label>Time</label>
        <select id="groom-time">
          <option>10:00 AM</option>
          <option>12:00 PM</option>
          <option>2:00 PM</option>
          <option>4:00 PM</option>
        </select>

        <button class="primary-btn" onclick="bookGrooming()">Book appointment</button>
        <div id="groom-error" class="error"></div>
      </div>
    </div>

        <div id="page-sitter" class="page hidden">
      <div class="form-box">
        <h2>🏠 Book a pet sitter</h2>

        <label>Which pet?</label>
        <select id="sitter-pet"></select>

        <label>Sitter</label>
        <select id="sitter-name" onchange="updateCost()"></select>

        <label>Date</label>
        <input type="date" id="sitter-date">

        <label>Start time</label>
        <select id="sitter-time">
          <option>8:00 AM</option>
          <option>10:00 AM</option>
          <option>12:00 PM</option>
          <option>2:00 PM</option>
          <option>4:00 PM</option>
          <option>6:00 PM</option>
        </select>

        <label>Hours (minimum 3)</label>
        <input type="number" id="sitter-hours" value="3" min="3" max="12" oninput="updateCost()">

        <div id="sitter-cost" class="cost"></div>

        <button class="primary-btn" onclick="bookSitter()">Book sitter</button>
        <div id="sitter-error" class="error"></div>
      </div>
    </div>

    <div id="page-bookings" class="page hidden">
      <div id="bookings-list"></div>
    </div>

    <script src="script.js"></script>
    <script src="booking.js"></script>
  </body>
</html>
